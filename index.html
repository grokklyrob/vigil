<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A cloister. Hold still." />
    <meta name="theme-color" content="#0d0d14" />
    <meta name="color-scheme" content="dark" />
    <title>Vigil</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,body{margin:0;background:#0d0d14;color:#f5f0e1}
      html:has(body.vigil),body.vigil{overflow:hidden;height:100%;min-height:100dvh}
      #c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
      .wordmark{position:fixed;z-index:3;top:1rem;left:1rem;margin:0;font:0.68rem/1 ui-monospace,monospace;letter-spacing:0.28em;text-transform:uppercase;color:#f5f0e1}
      .controls{position:fixed;z-index:4;right:1rem;bottom:1rem;display:flex;gap:0.65rem}
      .stage{position:fixed;z-index:3;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 1.25rem 6.5rem;pointer-events:none}
      .skip{position:absolute;z-index:40;left:0.75rem;top:0.75rem}
      .skip:not(:focus):not(:focus-visible){clip:rect(0 0 0 0);clip-path:inset(50%);height:1px;width:1px;overflow:hidden}
      button{font:0.68rem/1 ui-monospace,monospace;letter-spacing:0.16em;text-transform:lowercase;color:#f5f0e1;background:transparent;border:1px solid #f5f0e1;padding:0.45rem 0.7rem;cursor:pointer}
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="vigil">
    <a class="skip" href="/reader">plain text</a>
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="veil" id="veil" aria-hidden="true"></div>
    <p class="wordmark">Vigil</p>
    <main class="stage">
      <article class="copy" id="copy">
        <p class="kicker" id="kicker"></p>
        <div class="body" id="body"></div>
      </article>
      <div class="sr-only" id="live" aria-live="polite"></div>
    </main>
    <div class="controls">
      <button type="button" id="drone" aria-pressed="false">drone</button>
      <button type="button" id="advance">continue</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
